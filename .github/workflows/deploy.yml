# Baut die App aus dem ACP-Repository (Submodule), prüft sie und veröffentlicht sie.
# Pull Requests (z. B. von Dependabot) werden nur gebaut und geprüft, nicht veröffentlicht.
name: Build und Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build, Prüfung, Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Code und ACP-Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Daten aus dem ACP-Repository erzeugen und prüfen
        run: python3 build/build_data.py

      - name: Rechenlogik testen
        run: node tests/scoring.test.mjs

      - name: Auf Azure Static Web Apps veröffentlichen
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src
          skip_app_build: true
          skip_api_build: true
